<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Commands People and Actions flow</title>
  <desc id="desc">People aliases and Action bindings feed the /a chat command</desc>
  <rect width="640" height="200" rx="12" fill="#1c1626"/>
  <text x="24" y="32" fill="#d4a017" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Settings - Commands - chat</text>
  <rect x="24" y="56" width="160" height="90" rx="10" fill="#2a2238" stroke="rgba(255,255,255,0.14)"/>
  <text x="104" y="90" text-anchor="middle" fill="#d4a017" font-family="system-ui,sans-serif" font-size="14" font-weight="600">People</text>
  <text x="104" y="112" text-anchor="middle" fill="#f0e6d4" font-family="system-ui,sans-serif" font-size="11">Alias to Member ID</text>
  <text x="104" y="130" text-anchor="middle" fill="#a898b0" font-family="system-ui,sans-serif" font-size="10">e.g. Alice to 12345</text>
  <rect x="240" y="56" width="160" height="90" rx="10" fill="#2a2238" stroke="rgba(255,255,255,0.14)"/>
  <text x="320" y="90" text-anchor="middle" fill="#d4a017" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Actions</text>
  <text x="320" y="112" text-anchor="middle" fill="#f0e6d4" font-family="system-ui,sans-serif" font-size="11">Name to slot + activity</text>
  <text x="320" y="130" text-anchor="middle" fill="#a898b0" font-family="system-ui,sans-serif" font-size="10">e.g. kiss to ItemMouth</text>
  <rect x="456" y="56" width="160" height="90" rx="10" fill="#3c3050" stroke="#d4a017" stroke-width="2"/>
  <text x="536" y="90" text-anchor="middle" fill="#d4a017" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Chat</text>
  <text x="536" y="112" text-anchor="middle" fill="#f0e6d4" font-family="system-ui,sans-serif" font-size="12">/a Alice kiss</text>
  <text x="536" y="130" text-anchor="middle" fill="#a898b0" font-family="system-ui,sans-serif" font-size="10">Tab to autocomplete</text>
  <path d="M184 101 H232" stroke="#a898b0" stroke-width="2"/>
  <path d="M400 101 H448" stroke="#a898b0" stroke-width="2"/>
  <text x="320" y="180" text-anchor="middle" fill="#a898b0" font-family="system-ui,sans-serif" font-size="11">Separate from Settings - Actions (Activity Menu entries)</text>
</svg>
